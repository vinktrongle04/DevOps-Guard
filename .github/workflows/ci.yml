# ============================================================
# DevOps-Guard CI Pipeline
# Runs all Quality Gates on every push/PR to main.
# No deploy step — this repo ships an npm package and a GitHub
# Action, not a hosted service.
# ============================================================

name: DevOps-Guard CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── QUALITY GATES ──────────────────────────────────────────
  quality-gates:
    name: Quality Gates (Gate 1-4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 & Gate 2 — DevOps-Guard Action
        uses: ./
        with:
          command: all

      - name: Gate 3 — Lint (Code Quality)
        run: npm run lint

      - name: Gate 4 — Test suite
        run: npm test

      - name: Build — Verify production bundle
        run: npm run build
